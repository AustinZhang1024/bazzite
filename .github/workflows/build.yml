name: bluebuild
on:
  schedule:
    - cron:
        "00 06 * * *" # build at 06:00 UTC every day
        # (20 minutes after last ublue images start building)
  push:
    paths-ignore: # don't rebuild if only documentation has changed
      - "**.md"

  pull_request:
  workflow_dispatch: # allow manually triggering builds
concurrency:
  # only run one build at a time
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true
jobs:
  check-update:
    name: Check for base image update
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}
    steps:
      - name: Install skopeo
        run: sudo apt-get update && sudo apt-get install -y skopeo jq

      - name: Find last successful run
        id: last-run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RUN_ID=$(gh run list \
            --workflow "${{ github.workflow }}" \
            --status success \
            --limit 1 \
            --json databaseId \
            --jq '.[0].databaseId')
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"

      - name: Download previous digest
        if: steps.last-run.outputs.run_id != ''
        uses: actions/download-artifact@v8
        with:
          name: last-digest
          path: .
          github-token: ${{ github.token }}
          run-id: ${{ steps.last-run.outputs.run_id }}
        continue-on-error: true

      - name: Check if base image updated
        id: check
        run: |
          NEW_DIGEST=$(skopeo inspect docker://ghcr.io/ublue-os/bazzite:latest | jq -r .Digest)
          OLD_DIGEST=$(cat last_digest.txt 2>/dev/null || echo "none")
          echo "Old: $OLD_DIGEST"
          echo "New: $NEW_DIGEST"
          echo "$NEW_DIGEST" > last_digest.txt
          if [ "$NEW_DIGEST" = "$OLD_DIGEST" ]; then
            echo "should_build=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload new digest
        uses: actions/upload-artifact@v7
        with:
          name: last-digest
          path: last_digest.txt
          retention-days: 90
  bluebuild:
    name: Build Custom Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false # stop GH from cancelling all matrix builds if one fails
      matrix:
        recipe:
          # !! Add your recipes here
          - recipe.yml
    steps:
      # the build is fully handled by the reusable github action
      - name: Build Custom Image
        uses: blue-build/github-action@v1.12
        with:
          recipe: ${{ matrix.recipe }}
          cosign_private_key: ${{ secrets.SIGNING_SECRET }}
          registry_token: ${{ github.token }}
          pr_event_number: ${{ github.event.number }}

          # enabled by default, disable if your image is small and you want faster builds
          maximize_build_space: true
          build_chunked_oci: true
          use_cache: true
